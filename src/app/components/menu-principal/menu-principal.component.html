<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="ir('/inicio')" fill="outline" shape="round" size="small">
        <ion-icon slot="start" name="home-outline"></ion-icon>
        Inicio
      </ion-button>
      <ion-button (click)="ir('/saludo')" fill="outline" shape="round" size="small">
        <ion-icon slot="start" name="hand-left-outline"></ion-icon>
        Saludo
      </ion-button>
      <ion-button (click)="ir('/galeria')" fill="outline" shape="round" size="small">
        <ion-icon slot="start" name="images-outline"></ion-icon>
        Galería
      </ion-button>
      <ion-button (click)="ir('/noticias')" fill="outline" shape="round" size="small">
        <ion-icon slot="start" name="newspaper-outline"></ion-icon>
        Noticias
      </ion-button>
      <ion-button (click)="ir('/login')" fill="outline" shape="round" size="small">
        <ion-icon slot="start" name="log-in-outline"></ion-icon>
        Login
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
